name: Actualizar precios

# Todos los días a las 11:00 UTC (6:00 a. m. en Colombia): el boletín semanal
# de Asosubastas sale un día variable de la semana, así que se revisa a diario
# y se publica solo cuando hay uno nuevo. También se puede lanzar a mano desde
# la pestaña Actions.
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probar el extractor (si la fuente cambió de redacción, no publicar)
        run: python3 test_update_precios.py

      - name: Buscar el boletín nuevo
        run: python3 update_precios.py

      - name: Publicar si cambió
        run: |
          if git diff --quiet -- precios.json; then
            echo "Sin cambios que publicar."
            exit 0
          fi
          git config user.name "digifinca-precios bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add precios.json
          git commit -m "precios: $(python3 -c "import json;print(json.load(open('precios.json'))['semana'])")"
          git push
